  # Example of a vendor feed for Instagram/TikTok/Facebook (uncomment and adapt). Add an
  # optional `image` field mapping if the vendor returns a photo URL:
  # - name: "Taco Bell"
  #   x: tacobell
  #   sources:
  #     - type: json
  #       label: Instagram
  #       url: "https://api.your-vendor.example/v2/dataset/items?token=${VENDOR_TOKEN}"
  #       fields: {id: id, text: caption, url: url, posted: timestamp, image: displayUrl}

# News/aggregator RSS feeds. Claude works out the chain from the text. Only facts are
# extracted; each item links back to the original article. Both feeds below were checked.
global_sources:
  - {type: rss, label: Brand Eating, url: "https://www.brandeating.com/feeds/posts/default"}
  - {type: rss, label: The Fast Food Post, url: "https://www.fastfoodpost.com/feed/"}
