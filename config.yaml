# Optional settings (uncomment to use):
#   site_url: "https://yourdomain.com"        # your public address, used in page links and the sitemap
#   contact_url: "mailto:you@yourdomain.com"  # footer link for questions and removal requests (https:// or mailto:)
contact_url: "https://docs.google.com/forms/d/e/1FAIpQLSdLBXDpPbOPYz3TnWGFuguZzYFKmqZsAXC4Wytbuszvb4RtyA/viewform"
# Photos are OFF by default. List a chain here ONLY after it gives you written permission to show its photos.
photo_permission: []

# Chains to watch.
#   name: the display name (also used to tidy up names found in news feeds)
#   x:    the chain's X (Twitter) handle. Optional. VERIFY each handle before relying on it;
#         a wrong handle just logs a warning and is skipped.
# X handles only do something if the X_BEARER_TOKEN secret is set. Each handle costs about
# 2 X API calls per run, so a long list gets expensive on paid X tiers. Trim as needed.
chains:
  # Burgers
  - {name: "McDonald's", x: McDonalds}
  - {name: "Burger King", x: BurgerKing}
  - {name: "Wendy's", x: Wendys}
  - {name: "Sonic", x: sonicdrivein}
  - {name: "Jack in the Box", x: jackinthebox}
  - {name: "Carl's Jr.", x: CarlsJr}
  - {name: "Hardee's", x: Hardees}
  - {name: "Whataburger", x: Whataburger}
  - {name: "Culver's", x: Culvers}
  - {name: "Shake Shack", x: shakeshack}
  - {name: "Five Guys", x: FiveGuys}
  - {name: "White Castle", x: WhiteCastle}
  - {name: "Steak 'n Shake", x: SteaknShake}
  - {name: "Checkers & Rally's"}
  - {name: "Krystal"}
  # Chicken
  - {name: "KFC", x: KFC}
  - {name: "Popeyes", x: PopeyesChicken}
  - {name: "Chick-fil-A", x: ChickfilA}
  - {name: "Raising Cane's", x: raisingcanes}
  - {name: "Zaxby's", x: Zaxbys}
  - {name: "Bojangles"}
  - {name: "Church's Texas Chicken"}
  - {name: "El Pollo Loco", x: ElPolloLoco}
  - {name: "Wingstop", x: Wingstop}
  - {name: "Buffalo Wild Wings", x: BWWings}
  - {name: "Dave's Hot Chicken", x: DavesHotChicken}
  # Mexican
  - {name: "Taco Bell", x: tacobell}
  - {name: "Del Taco", x: deltaco}
  - {name: "Chipotle"}
  - {name: "Qdoba", x: Qdoba}
  - {name: "Moe's Southwest Grill"}
  # Pizza
  - {name: "Domino's", x: dominos}
  - {name: "Pizza Hut", x: pizzahut}
  - {name: "Papa Johns", x: PapaJohns}
  - {name: "Little Caesars", x: LittleCaesars}
