name: Update LTO data
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: lto-update
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python collector.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          VENDOR_TOKEN: ${{ secrets.VENDOR_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "lto-bot"
          git config user.email "lto-bot@users.noreply.github.com"
          git add lto.json seen.json
          git diff --staged --quiet || (git commit -m "Update LTO data" && git push)
